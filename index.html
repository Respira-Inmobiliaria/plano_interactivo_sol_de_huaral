<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Plano Interactivo Sol de Huaral</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      font-size: 16px;
    }

    /* === NUEVO: Barra superior con botones de filtro === */
    .top-bar {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 999;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-filtro {
      border: 1px solid #999;
      background: #f2f2f2;
      color: #333;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .btn-filtro.activo {
      border-color: #1f6feb;
      background: #1f6feb;
      color: #fff;
    }

    .acciones-topbar {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-actualizar {
      border: 1px solid #0b57d0;
      background: #0b57d0;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 21px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .btn-actualizar:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .hora-actualizacion {
      font-size: 22px;
      font-weight: 700;
      color: #2c3e50;
      white-space: nowrap;
    }

    /* En móvil, que los botones se acomoden mejor */
    @media (max-width: 480px) {
      .top-bar {
        flex-wrap: wrap;
      }
      .btn-filtro {
        flex: 1 1 calc(50% - 10px);
        text-align: center;
      }
      .acciones-topbar {
        margin-left: 0;
        width: 100%;
        justify-content: space-between;
      }
      .btn-actualizar {
        flex: 1 1 auto;
        text-align: center;
      }
      .hora-actualizacion {
        white-space: normal;
      }
    }

    /* === LAYOUT POR DEFECTO: VERTICAL (MÓVIL) === */
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .mapa-container {
      flex: none;
      height: 75vh;
      overflow: auto;
      background: #fff;
    }

    .mapa-container object {
      width: 100%;
      height: 100%;
      display: block;
      border: none;
    }

    .panel-info {
      flex: none;
      height: 25vh;
      padding: 16px;
      background: #ffffff;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
      box-sizing: border-box;
      overflow-y: auto;
      font-size: 25px;
    }

    .panel-info h2 {
      margin-top: 0;
      margin-bottom: 6px;
      color: #2c3e50;
      font-size: 33px;
    }

    .campo {
      margin-bottom: 0;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
    }

    .campo b {
      display: inline-block;
      width: 170px;
      min-width: 170px;
      color: #000000;
      font-weight: 700;
      line-height: 1.25;
    }

    .campo .valor {
      color: #0B4F8A;
      font-weight: 400;
      line-height: 1.25;
      flex: 1 1 auto;
      min-width: 0;
      word-break: break-word;
    }

    .estado-disponible { color: #2ecc71; font-weight: bold; }
    .estado-reservado  { color: #f1c40f; font-weight: bold; }
    .estado-vendido    { color: #e74c3c; font-weight: bold; }

    #infoLote {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 28px;
      row-gap: 16px;
      align-items: start;
    }

    @media (max-width: 480px) {
      #infoLote {
        grid-template-columns: 1fr;
      }
    }

    @media (min-width: 1024px) {
      .layout {
        flex-direction: row;
      }

      .mapa-container {
        flex: 2;
        height: auto;
      }

      .panel-info {
        flex: 1;
        height: auto;
        box-shadow: -2px 0 6px rgba(0,0,0,0.1);
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="btn-filtro" id="btnDisponibles">Lotes Disponibles</button>
    <button class="btn-filtro" id="btnReservados">Lotes Reservados</button>
    <button class="btn-filtro" id="btnFinanciados">Lotes Financiados</button>
    <button class="btn-filtro" id="btnContado">Lotes al Contado</button>
    <button class="btn-filtro" id="btnNoDisponibles">Lotes NO Disponibles</button>

    <div class="acciones-topbar">
      <button class="btn-actualizar" id="btnActualizarDatos">Actualizar datos</button>
      <span class="hora-actualizacion" id="horaActualizacion">Última actualización: --</span>
    </div>
  </div>

  <div class="layout">
    <div class="mapa-container">
      <object
        id="planoSvg"
        data="PLANO_SOL_DE_HUARAL_corregir.svg"
        type="image/svg+xml">
      </object>
    </div>

    <div class="panel-info">
      <h2 id="tituloLote">Seleccione un lote</h2>
      <div id="infoLote">
        <p>Haga clic en un lote del plano para ver sus detalles aquí mismo.</p>
      </div>
    </div>
  </div>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwmyLh86dC2fE-4mRWoaSadbtjkCU-Jcl3ZcYKN3ZdgVxo__RG0Orl7sdaxxi0JSiNR/exec";

    // Cache segura
    let CACHE_LOTES = {};
    let ESTADOS = {};
    let MOTIVOS = {};
    let SVG_DOC = null;
    let SVG_LOTES = [];
    let LOTE_SELECCIONADO = null;
    let filtroActual = null;

    const COLOR_DISPONIBLE     = "#ffffff";
    const COLOR_RESERVADO      = "#f1c40f";
    const COLOR_FINANCIADO     = "#1f4ed8";
    const COLOR_CONTADO        = "#e74c3c";
    const COLOR_NO_DISPONIBLE  = "#2f2f2f";
    const COLOR_SOMBRA         = "#000000";
    const COLOR_SELECCION      = "#00E5FF";

    function formatearFechaHora(fecha) {
      return new Intl.DateTimeFormat("es-PE", {
        timeZone: "America/Lima",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }).format(fecha);
    }

    function actualizarTextoHora(fecha = null) {
      const el = document.getElementById("horaActualizacion");
      if (!el) return;
      el.textContent = fecha
        ? "Última actualización: " + formatearFechaHora(fecha)
        : "Última actualización: --";
    }

    function normalizar(txt) {
      return String(txt || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function tieneDato(txt) {
      return String(txt || "").trim() !== "";
    }

    function loteTieneFichaCompleta(lote) {
      if (!lote || typeof lote !== "object") return false;
      const camposClave = [
        "Codigo_Automatico",
        "Proyecto",
        "Nombre_Lote"
      ];
      return camposClave.every(campo => campo in lote);
    }

    function obtenerDatoLider(lote, nombreColumna) {
      return lote ? (lote[nombreColumna] || "") : "";
    }

    function tieneReservaValidaLider(lote) {
      if (!lote) return false;

      const estadoFormal = String(lote.Estado_en_fase_de_venta || "").trim();
      const reservarLote = String(obtenerDatoLider(lote, "Reservar_lote") || "").trim();
      const liderReserva = String(obtenerDatoLider(lote, "Líder_Reserva") || "").trim();
      const asesorReserva = String(obtenerDatoLider(lote, "Asesor_Reserva") || "").trim();

      return (
        estadoFormal === "" &&
        normalizar(reservarLote) === "reservado" &&
        liderReserva !== "" &&
        asesorReserva !== ""
      );
    }

    function obtenerEstadoVisualLote(lote) {
      if (!lote) return "";

      const estadoFormal = String(lote.Estado_en_fase_de_venta || "").trim();
      if (estadoFormal !== "") {
        return estadoFormal;
      }

      if (tieneReservaValidaLider(lote)) {
        return "Reservado";
      }

      return "";
    }

    function obtenerAsesorVisualLote(lote) {
      if (!lote) return "";

      const estadoFormal = String(lote.Estado_en_fase_de_venta || "").trim();
      if (estadoFormal !== "") {
        return lote.Asesor_Responsable || "";
      }

      if (tieneReservaValidaLider(lote)) {
        return obtenerDatoLider(lote, "Asesor_Reserva");
      }

      return "";
    }

    function obtenerLiderVisualLote(lote) {
      if (!lote) return "";

      const estadoFormal = String(lote.Estado_en_fase_de_venta || "").trim();
      if (estadoFormal !== "") {
        return lote.Líder_Responsable || "";
      }

      if (tieneReservaValidaLider(lote)) {
        return obtenerDatoLider(lote, "Líder_Reserva");
      }

      return lote.Líder_Responsable || "";
    }

    async function obtenerLoteDesdeAPI(codigo) {
      try {
        const url = URL_API + "?lote=" + encodeURIComponent(codigo);
        console.log("[API] Llamando a:", url);
        const res = await fetch(url, { cache: "no-store" });

        if (!res.ok) {
          console.error("[API] Error HTTP", res.status, res.statusText);
          return null;
        }

        const data = await res.json();
        console.log("[API] Respuesta lote individual:", data);

        if (data && typeof data === "object" && data.Codigo_Automatico) {
          CACHE_LOTES[data.Codigo_Automatico] = {
            ...(CACHE_LOTES[data.Codigo_Automatico] || {}),
            ...data
          };
        }

        return data;
      } catch (err) {
        console.error("[API] Error de red o parseo:", err);
        return null;
      }
    }

    async function obtenerLoteSeguro(codigo) {
      const enCache = CACHE_LOTES[codigo];

      if (loteTieneFichaCompleta(enCache)) {
        return enCache;
      }

      const desdeAPI = await obtenerLoteDesdeAPI(codigo);

      if (desdeAPI && Object.keys(desdeAPI).length > 0) {
        return desdeAPI;
      }

      return enCache || null;
    }

    function mostrarLoteEnPanel(lote) {
      const titulo = document.getElementById("tituloLote");
      const info   = document.getElementById("infoLote");

      if (!lote || Object.keys(lote).length === 0) {
        titulo.textContent = "Lote no encontrado";
        info.innerHTML = "<p>No se encontraron datos para este lote.</p>";
        return;
      }

      const estadoVisual = obtenerEstadoVisualLote(lote);
      const asesorVisual = obtenerAsesorVisualLote(lote);
      const liderVisual  = obtenerLiderVisualLote(lote);

      titulo.textContent = "Lote " + (lote.Nombre_Lote || lote.Codigo_Automatico);

      info.innerHTML = `
        <div class="campo"><b>Código automático:</b><span class="valor">${lote.Codigo_Automatico || ""}</span></div>
        <div class="campo"><b>Proyecto:</b><span class="valor">${lote.Proyecto || ""}</span></div>
        <div class="campo"><b>Manzana:</b><span class="valor">${lote.Manzana || ""}</span></div>
        <div class="campo"><b>Nombre de lote:</b><span class="valor">${lote.Nombre_Lote || ""}</span></div>
        <div class="campo"><b>Área (m²):</b><span class="valor">${lote.Área_Lote_m2 || ""}</span></div>
        <div class="campo"><b>Frente (m):</b><span class="valor">${lote.Frente_m || ""}</span></div>
        <div class="campo"><b>Derecha (m):</b><span class="valor">${lote.Derecha_m || ""}</span></div>
        <div class="campo"><b>Izquierda (m):</b><span class="valor">${lote.Izquierda_m || ""}</span></div>
        <div class="campo"><b>Fondo (m):</b><span class="valor">${lote.Fondo_m || ""}</span></div>
        <div class="campo"><b>Estado:</b><span class="valor">${lote.Estado || ""}</span></div>
        <div class="campo"><b>Precio lista:</b><span class="valor">${lote.Precio_Lista || ""}</span></div>
        <div class="campo"><b>Permite otro precio:</b><span class="valor">${lote.Permitir_Otro_Precio || ""}</span></div>
        <div class="campo"><b>Ubicación:</b><span class="valor">${lote.Detalles_de_Ubicación || ""}</span></div>
        <div class="campo"><b>Motivo no disponible:</b><span class="valor">${lote.Motivo_por_qué_no_disponible || ""}</span></div>
        <div class="campo"><b>Estado en fase de venta:</b><span class="valor">${estadoVisual}</span></div>
        <div class="campo"><b>Líder Responsable:</b><span class="valor">${liderVisual}</span></div>
        <div class="campo"><b>Asesor responsable:</b><span class="valor">${asesorVisual}</span></div>
      `;
    }

    function aplicarEstiloSeleccion(el) {
      if (!el) return;
      el.style.stroke = COLOR_SELECCION;
      el.style.strokeOpacity = 1;
      el.style.strokeWidth = 15;
      el.style.strokeDasharray = "10,6";
      el.style.strokeLinecap = "round";
      el.style.strokeLinejoin = "round";
    }

    function reaplicarSeleccion() {
      if (!LOTE_SELECCIONADO || !SVG_DOC) return;
      const el = SVG_DOC.getElementById(LOTE_SELECCIONADO);
      if (el) aplicarEstiloSeleccion(el);
    }

    function obtenerVisualLote(codigo) {
      const lote = CACHE_LOTES[codigo] || null;
      const estado = lote ? obtenerEstadoVisualLote(lote) : (ESTADOS[codigo] || "");
      const motivo = lote ? (lote.Motivo_por_qué_no_disponible || "") : (MOTIVOS[codigo] || "");

      const estN = normalizar(estado);
      const motivoTieneDato = tieneDato(motivo);

      if (estN === "reservado") {
        return { tipo: "reservados", color: COLOR_RESERVADO, fillOpacity: 0.78 };
      }

      if (estN === "financiado") {
        return { tipo: "financiados", color: COLOR_FINANCIADO, fillOpacity: 0.78 };
      }

      if (estN === "contado") {
        return { tipo: "contado", color: COLOR_CONTADO, fillOpacity: 0.78 };
      }

      if (estN === "" && motivoTieneDato) {
        return { tipo: "no_disponibles", color: COLOR_NO_DISPONIBLE, fillOpacity: 0.72 };
      }

      if (estN === "") {
        return { tipo: "disponibles", color: COLOR_DISPONIBLE, fillOpacity: 0.78 };
      }

      return { tipo: "otros", color: COLOR_NO_DISPONIBLE, fillOpacity: 0.72 };
    }

    async function cargarEstadosLotes() {
      try {
        const url = URL_API + "?todos=1";
        console.log("[API] Cargando estados:", url);
        const res = await fetch(url, { cache: "no-store" });

        if (!res.ok) {
          console.error("[API] Error HTTP al pedir todos los lotes", res.status, res.statusText);
          return;
        }

        const data = await res.json();

        ESTADOS = {};
        MOTIVOS = {};

        (data || []).forEach(row => {
          const code = row.Codigo_Automatico;
          if (code) {
            CACHE_LOTES[code] = {
              ...(CACHE_LOTES[code] || {}),
              ...row
            };
            ESTADOS[code] = obtenerEstadoVisualLote(row);
            MOTIVOS[code] = row.Motivo_por_qué_no_disponible || "";
          }
        });

        console.log("[API] Estados cargados:", Object.keys(ESTADOS).length);
        actualizarTextoHora(new Date());

        if (SVG_DOC && SVG_LOTES.length) {
          if (filtroActual === null) {
            pintarTodosPorEstado();
          } else {
            aplicarFiltro(filtroActual);
          }
        }

        if (LOTE_SELECCIONADO && CACHE_LOTES[LOTE_SELECCIONADO]) {
          const loteActual = CACHE_LOTES[LOTE_SELECCIONADO];
          if (loteTieneFichaCompleta(loteActual)) {
            mostrarLoteEnPanel(loteActual);
          }
        }
      } catch (err) {
        console.error("[API] Error cargando estados:", err);
      }
    }

    function capturarSVG() {
      const obj = document.getElementById("planoSvg");
      if (!obj) return;

      SVG_DOC = obj.contentDocument || (obj.getSVGDocument && obj.getSVGDocument());
      if (!SVG_DOC) return;

      SVG_LOTES = Array.from(SVG_DOC.querySelectorAll(".lote"));
      console.log("[FILTRO] Lotes capturados del SVG:", SVG_LOTES.length);
    }

    function pintarTodosPorEstado() {
      filtroActual = null;
      document.querySelectorAll(".btn-filtro").forEach(b => b.classList.remove("activo"));

      SVG_LOTES.forEach(el => {
        const codigo = el.id;
        const visual = obtenerVisualLote(codigo);

        el.style.stroke = "#000000";
        el.style.strokeOpacity = 0.35;
        el.style.strokeWidth = 2;
        el.style.strokeDasharray = "";
        el.style.fill = visual.color;
        el.style.fillOpacity = visual.fillOpacity;
      });

      reaplicarSeleccion();
    }

    function aplicarFiltro(tipo) {
      filtroActual = tipo;

      SVG_LOTES.forEach(el => {
        const codigo = el.id;
        const visual = obtenerVisualLote(codigo);

        let coincide = false;
        if (tipo === "disponibles")    coincide = (visual.tipo === "disponibles");
        if (tipo === "reservados")     coincide = (visual.tipo === "reservados");
        if (tipo === "financiados")    coincide = (visual.tipo === "financiados");
        if (tipo === "contado")        coincide = (visual.tipo === "contado");
        if (tipo === "no_disponibles") coincide = tieneDato(MOTIVOS[codigo]);

        el.style.fill = COLOR_SOMBRA;
        el.style.fillOpacity = 0.78;
        el.style.stroke = "#000000";
        el.style.strokeOpacity = 0.5;
        el.style.strokeWidth = 2;
        el.style.strokeDasharray = "";

        if (coincide) {
          el.style.fill = visual.color;
          el.style.fillOpacity = visual.fillOpacity;
          el.style.strokeOpacity = 0.9;
          el.style.strokeWidth = 2.5;
        }
      });

      reaplicarSeleccion();
    }

    function configurarBotonesFiltro() {
      const btnDisponibles   = document.getElementById("btnDisponibles");
      const btnReservados    = document.getElementById("btnReservados");
      const btnFinanciados   = document.getElementById("btnFinanciados");
      const btnContado       = document.getElementById("btnContado");
      const btnNoDisponibles = document.getElementById("btnNoDisponibles");

      function activar(btn) {
        document.querySelectorAll(".btn-filtro").forEach(b => b.classList.remove("activo"));
        btn.classList.add("activo");
      }

      btnDisponibles.addEventListener("click", () => {
        if (!SVG_DOC || !SVG_LOTES.length) return;
        activar(btnDisponibles);
        aplicarFiltro("disponibles");
      });

      btnReservados.addEventListener("click", () => {
        if (!SVG_DOC || !SVG_LOTES.length) return;
        activar(btnReservados);
        aplicarFiltro("reservados");
      });

      btnFinanciados.addEventListener("click", () => {
        if (!SVG_DOC || !SVG_LOTES.length) return;
        activar(btnFinanciados);
        aplicarFiltro("financiados");
      });

      btnContado.addEventListener("click", () => {
        if (!SVG_DOC || !SVG_LOTES.length) return;
        activar(btnContado);
        aplicarFiltro("contado");
      });

      btnNoDisponibles.addEventListener("click", () => {
        if (!SVG_DOC || !SVG_LOTES.length) return;
        activar(btnNoDisponibles);
        aplicarFiltro("no_disponibles");
      });
    }

    function configurarBotonActualizar() {
      const btn = document.getElementById("btnActualizarDatos");
      if (!btn) return;

      btn.addEventListener("click", async () => {
        const textoOriginal = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Actualizando...";

        try {
          await cargarEstadosLotes();
        } finally {
          btn.disabled = false;
          btn.textContent = textoOriginal;
        }
      });
    }

    function inicializarEventosSVG() {
      const obj = document.getElementById("planoSvg");
      if (!obj) {
        console.error("[SVG] No se encuentra el elemento #planoSvg");
        return;
      }

      console.log("[SVG] inicializarEventosSVG ejecutado");

      function conectarEventos() {
        const svgDoc = obj.contentDocument || (obj.getSVGDocument && obj.getSVGDocument());
        if (!svgDoc) {
          console.error("[SVG] No se pudo acceder a contentDocument/getSVGDocument.");
          return;
        }

        const lotes = svgDoc.querySelectorAll(".lote");
        console.log("[SVG] Lotes encontrados en el SVG:", lotes.length);

        lotes.forEach(el => {
          el.style.cursor = "pointer";
          el.addEventListener("click", async (ev) => {
            ev.preventDefault();
            ev.stopPropagation();

            const codigo = el.id;
            console.log("[SVG] lote clicado:", codigo);

            const datos = await obtenerLoteSeguro(codigo);
            mostrarLoteEnPanel(datos);

            LOTE_SELECCIONADO = codigo;
            if (filtroActual === null) {
              pintarTodosPorEstado();
            } else {
              aplicarFiltro(filtroActual);
            }
          });
        });

        if (!lotes.length) {
          console.warn("[SVG] Atención: no se encontró ningún elemento con class='lote'.");
        }
      }

      obj.addEventListener("load", conectarEventos, { once: true });
    }

    function inicializarFiltros() {
      configurarBotonesFiltro();
      cargarEstadosLotes();

      const obj = document.getElementById("planoSvg");
      if (!obj) return;

      obj.addEventListener("load", () => {
        capturarSVG();

        if (SVG_DOC && SVG_LOTES.length) {
          pintarTodosPorEstado();
        }
      }, { once: true });
    }

    window.addEventListener("DOMContentLoaded", () => {
      console.log("[APP] DOMContentLoaded");
      actualizarTextoHora();
      inicializarEventosSVG();
      inicializarFiltros();
      configurarBotonActualizar();
    });
  </script>

</body>
</html>
